substitutions:
  version: "v0.1.0"

esphome:
  name: weather-paper
  friendly_name: Weather Paper
  comment: "CrowPanel 5.79in e-paper weather dashboard"
  includes:
    - weather_paper.h
  on_boot:
    - priority: 250
      then:
        - lambda: |-
            // sync runtime settings from config.txt
            id(wifi_on) = id(sd_reader)->get_wifi_enabled();
            id(temp_c) = id(sd_reader)->get_temp_c();
            id(press_hpa) = id(sd_reader)->get_press_hpa();
            id(weather_wifi) = id(sd_reader)->get_weather_wifi();
            id(full_refresh) = id(sd_reader)->get_full_refresh();
            id(update_min) = id(sd_reader)->get_update_min();
            id(lat) = id(sd_reader)->get_lat();
            id(lon) = id(sd_reader)->get_lon();
            id(ruuvi_on) = id(sd_reader)->get_ruuvi_enabled();
            id(time_fmt) = id(sd_reader)->get_time_fmt();
            id(epd)->set_full_update_every(id(full_refresh) ? 1 : 60);
            // enter setup mode on first boot (no WiFi credentials)
            if (!id(sd_reader)->has_credentials()) {
              id(setup_mode) = true;
              id(wifi_comp)->enable();
              id(epd)->set_full_update_every(1);
              id(epd)->update();
            }
            // set Ruuvi MAC (only if enabled)
            if (id(ruuvi_on)) {
              auto mac_str = id(sd_reader)->get_sensor_mac();
              if (!mac_str.empty()) {
                unsigned int v[6];
                if (sscanf(mac_str.c_str(), "%x:%x:%x:%x:%x:%x", &v[0], &v[1], &v[2], &v[3], &v[4], &v[5]) == 6) {
                  uint64_t mac = 0;
                  for (int i = 0; i < 6; i++) mac = (mac << 8) | v[i];
                  id(ruuvi_tag)->set_address(mac);
                  ESP_LOGI("main", "Ruuvi MAC set from config.txt: %s", mac_str.c_str());
                } else {
                  ESP_LOGW("main", "Invalid config.txt mac format: '%s'", mac_str.c_str());
                }
              }
            }
    - priority: 100
      then:
        - if:
            condition:
              lambda: 'return !id(setup_mode);'
            then:
              - script.execute: wake_cycle

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  flash_mode: dio
  flash_frequency: 40MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2
  - source:
      type: local
      path: components

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

globals:
  - id: online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: temperature
    type: float
    restore_value: no
    initial_value: '75.0'
  - id: last_ruuvi_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_on
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: temp_c
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: press_hpa
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: weather_wifi
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: ruuvi_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: time_fmt
    type: int
    restore_value: no
    initial_value: '0'
  - id: setup_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reset_confirm
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setup_connecting
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setup_failed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: full_refresh
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: update_min
    type: int
    restore_value: no
    initial_value: '60'
  - id: initial_scan_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wake_count
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: do_hourly
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: force_update
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: loading
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_epoch
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: last_rtc_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: settings_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: settings_sel
    type: int
    restore_value: no
    initial_value: '0'
  - id: wifi_temp
    type: float
    restore_value: yes
    initial_value: '0'
  - id: wifi_hum
    type: float
    restore_value: yes
    initial_value: '0'
  - id: wifi_press
    type: float
    restore_value: yes
    initial_value: '0'
  - id: wifi_wind
    type: float
    restore_value: yes
    initial_value: '0'
  - id: wifi_wind_dir
    type: float
    restore_value: yes
    initial_value: '0'
  - id: obs_got_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: used_fallback
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: splash_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_code
    type: int
    restore_value: yes
    initial_value: '0'
  - id: wifi_weather_valid
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: last_wifi_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_wx_month
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_wx_day
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_wx_hour
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_wx_minute
    type: int
    restore_value: yes
    initial_value: '0'
  - id: lat
    type: float
    restore_value: no
    initial_value: '0'
  - id: lon
    type: float
    restore_value: no
    initial_value: '0'
  - id: geocoded_zip
    type: int
    restore_value: yes
    initial_value: '0'
  - id: daily_max
    type: float[7]
    restore_value: yes
  - id: daily_min
    type: float[7]
    restore_value: yes
  - id: daily_code
    type: int[7]
    restore_value: yes
  - id: daily_precip
    type: int[7]
    restore_value: yes
  - id: wifi_rssi
    type: int
    restore_value: yes
    initial_value: '0'

wifi:
  id: wifi_comp
  enable_on_boot: false
  networks:
    - ssid: "placeholder"
      password: "placeholder"
  ap:
    ssid: "WeatherPaper-Setup"
    ap_timeout: 10s
  on_connect:
    - globals.set:
        id: online
        value: 'true'
    - lambda: 'esp_sntp_restart();'
  on_disconnect:
    - globals.set:
        id: online
        value: 'false'

captive_portal:

time:
  - platform: sntp
    id: my_time
    timezone: America/Chicago
    servers:
      - pool.ntp.org
      - time.nist.gov
    on_time_sync:
      - lambda: |-
          ESP_LOGI("main", "NTP time synced");
          id(last_epoch) = (uint32_t) id(my_time).now().timestamp;
          id(last_rtc_s) = (uint32_t) (esp_rtc_get_time_us() / 1000000ULL);

http_request:
  timeout: 15s
  verify_ssl: false
  useragent: "weather-paper (sharby@localhost)"

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 60s
  esp32_ext1_wakeup:
    pins:
      - number: 2
        allow_other_uses: true
      - number: 5
        allow_other_uses: true
    mode: ANY_LOW

sd_wifi_reader:
  id: sd_reader

interval:
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(setup_mode) && esphome::captive_portal::global_captive_portal != nullptr && esphome::captive_portal::global_captive_portal->has_config();'
          then:
            - lambda: |-
                auto *cp = esphome::captive_portal::global_captive_portal;
                id(sd_reader)->save_wifi_creds(cp->get_ssid(), cp->get_psk(), cp->get_zip());
                id(setup_mode) = false;
                id(setup_connecting) = true;
                ESP_LOGI("main", "Setup submit: ssid=%s zip=%s", cp->get_ssid().c_str(), cp->get_zip().c_str());
            - script.execute: setup_connect

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: false
    interval: 1100ms
    window: 110ms
    continuous: false
    duration: 10s

sensor:
  - platform: ruuvitag
    id: ruuvi_tag
    mac_address: "DE:31:C3:1E:52:31"
    temperature:
      id: ruuvi_temp
      on_value:
        - lambda: 'id(last_ruuvi_millis) = millis();'
    humidity:
      id: ruuvi_hum
    pressure:
      id: ruuvi_press
    battery_voltage:
      id: ruuvi_batt
    movement_counter:
      id: ruuvi_move

binary_sensor:
  - platform: gpio
    pin:
      number: 2
      inverted: true
      allow_other_uses: true
      mode:
        input: true
        pullup: true
    id: menu_btn
    on_press:
      - lambda: 'id(settings_mode) = true; id(epd)->set_full_update_every(1); id(epd).update();'
  - platform: gpio
    pin:
      number: 1
      inverted: true
      mode:
        input: true
        pullup: true
    id: exit_btn
    on_press:
      - if:
          condition:
            lambda: 'return id(reset_confirm);'
          then:
            - lambda: 'id(reset_confirm) = false; id(epd).update();'
          else:
            - if:
                condition:
                  lambda: 'return id(settings_mode);'
                then:
                  - lambda: 'id(settings_mode) = false; id(epd).update();'
                  - delay: 3s
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      sleep_duration: 60s
  - platform: gpio
    pin:
      number: 5
      inverted: true
      allow_other_uses: true
      mode:
        input: true
        pullup: true
    id: rotary_press
    on_press:
      - lambda: |-
          if (id(reset_confirm)) {
            id(sd_reader)->factory_reset();
            ESP_LOGI("main", "Factory reset done, rebooting");
            esp_restart();
          } else if (id(settings_mode)) {
            if (id(settings_sel) == 8) {
              id(reset_confirm) = true;
            } else {
              if (id(settings_sel) == 0) {
                id(wifi_on) = !id(wifi_on);
                if (id(wifi_on)) id(wifi_comp)->enable(); else id(wifi_comp)->disable();
              } else if (id(settings_sel) == 1) {
                id(weather_wifi) = !id(weather_wifi);
              } else if (id(settings_sel) == 2) {
                id(ruuvi_on) = !id(ruuvi_on);
              } else if (id(settings_sel) == 3) {
                id(temp_c) = !id(temp_c);
              } else if (id(settings_sel) == 4) {
                id(press_hpa) = !id(press_hpa);
              } else if (id(settings_sel) == 5) {
                id(time_fmt) = (id(time_fmt) + 1) % 3;
              } else if (id(settings_sel) == 6) {
                id(full_refresh) = !id(full_refresh);
                id(epd)->set_full_update_every(id(full_refresh) ? 1 : 60);
              } else {
                id(update_min) = (id(update_min) == 60) ? 30 : 60;
              }
              id(sd_reader)->save_config(id(wifi_on), id(temp_c), id(press_hpa), id(weather_wifi),
                                         id(full_refresh), id(update_min), id(ruuvi_on), id(time_fmt));
            }
            id(epd).update();
          } else if (!id(setup_mode) && !id(setup_connecting) && !id(do_hourly)) {
            // main display mode: single push forces a WiFi weather/time update now
            id(force_update) = true;
            id(loading) = true;
            id(wake_cycle)->execute();
            ESP_LOGI("main", "Push: force weather update");
          }
  - platform: gpio
    pin:
      number: 6
      inverted: true
      mode:
        input: true
        pullup: true
    id: rotary_up
    on_press:
      - lambda: 'if (id(settings_mode)) { id(settings_sel) = (id(settings_sel) + 8) % 9; id(epd).update(); }'
  - platform: gpio
    pin:
      number: 4
      inverted: true
      mode:
        input: true
        pullup: true
    id: rotary_down
    on_press:
      - lambda: 'if (id(settings_mode)) { id(settings_sel) = (id(settings_sel) + 1) % 9; id(epd).update(); }'

script:
  - id: setup_connect
    mode: restart
    then:
      - lambda: 'id(epd)->set_full_update_every(1); id(epd)->update();'
      - delay: 15s
      - if:
          condition:
            lambda: 'return id(online);'
          then:
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: 60s
          else:
            - lambda: |-
                id(setup_connecting) = false;
                id(setup_mode) = true;
                id(setup_failed) = true;
                id(epd)->update();
                ESP_LOGW("main", "Setup: WiFi connect failed (bad SSID or passphrase)");
  - id: wake_cycle
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;'
          then:
            # power-on: draw logo splash, then sleep so it stays on screen
            # until the next full-refresh wake cleans the panel (no ghosting)
            - lambda: |-
                id(splash_mode) = true;
                id(epd)->update();
                id(splash_mode) = false;
            - delay: 3s
            - lambda: 'ESP_LOGI("main", "splash sleep");'
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: 60s
      - lambda: |-
          // restore wall-clock from persisted epoch + RTC elapsed (survives deep sleep)
          if (id(last_epoch) > 0) {
            uint32_t rtc_now = (uint32_t) (esp_rtc_get_time_us() / 1000000ULL);
            int32_t elapsed = (int32_t) (rtc_now - id(last_rtc_s));
            if (elapsed >= 0) {
              struct timeval tv;
              tv.tv_sec = (time_t) (id(last_epoch) + (uint32_t) elapsed);
              tv.tv_usec = 0;
              settimeofday(&tv, nullptr);
            }
          }
          // button wake (EXT1) -> distinguish MENU (settings) vs center-push (weather update)
          if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1) {
            uint64_t status = esp_sleep_get_ext1_wakeup_status();
            if (status & (1ULL << 2)) {
              // MENU button -> open settings and stay awake
              id(settings_mode) = true;
              id(epd)->set_full_update_every(1);
              ESP_LOGI("main", "Wake -> SETTINGS (menu)");
            } else {
              // center push -> force a WiFi weather/time update
              id(do_hourly) = true;
              id(loading) = true;
              ESP_LOGI("main", "Wake -> FORCE UPDATE (center push)");
            }
          } else {
            id(wake_count) = id(wake_count) + 1;
            bool first = !id(my_time).now().is_valid();
            bool hourly = first || id(wake_count) >= (uint32_t) id(update_min) || id(force_update);
            if (id(force_update)) id(force_update) = false;
            uint32_t wc = id(wake_count);
            if (hourly) id(wake_count) = 0;
            id(do_hourly) = hourly;
            auto wt = id(my_time).now();
            ESP_LOGI("main", "Wake #%u %s time_valid=%d %02d:%02d",
                     wc, hourly ? "HOURLY" : "minute", (int) wt.is_valid(), wt.hour, wt.minute);
          }
      - if:
          condition:
            lambda: 'return id(settings_mode);'
          then:
            # settings: render + stay awake (no sleep)
            - component.update: epd
            - delay: 3s
          else:
            - if:
                condition:
                  lambda: 'return id(do_hourly);'
                then:
                  - if:
                      condition:
                        lambda: 'return id(loading);'
                      then:
                        - lambda: 'id(epd)->force_full_update();'
                        - component.update: epd
                  - lambda: |-
                      // hourly wake: enable WiFi (NTP); BLE scan only if Ruuvi on
                      if (id(wifi_on) && id(sd_reader)->has_credentials())
                        id(wifi_comp)->enable();
                  - delay: 3s
                  - if:
                      condition:
                        lambda: 'return id(ruuvi_on);'
                      then:
                        - lambda: |-
                            id(ble_tracker)->set_scan_continuous(false);
                            id(ble_tracker)->start_scan();
                  - delay: 20s
                  - if:
                      condition:
                        lambda: 'return id(weather_wifi);'
                      then:
                        # geocode zip -> lat/lon once (per zip change)
                        - if:
                            condition:
                              lambda: 'return (id(lat) == 0.0f || id(lon) == 0.0f) || id(geocoded_zip) != atoi(id(sd_reader)->get_zip().c_str());'
                            then:
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://geocoding-api.open-meteo.com/v1/search?name=%s&count=1&language=en&format=json", id(sd_reader)->get_zip().c_str());'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              auto res = root["results"][0];
                                              float la = res["latitude"].as<float>();
                                              float lo = res["longitude"].as<float>();
                                              if (la != 0.0f && lo != 0.0f) {
                                                id(lat) = la;
                                                id(lon) = lo;
                                                id(geocoded_zip) = atoi(id(sd_reader)->get_zip().c_str());
                                                id(sd_reader)->save_lat_lon(la, lo);
                                                id(sd_reader)->clear_nws_cache();
                                                ESP_LOGI("main", "Geocoded %s -> %.4f, %.4f", id(sd_reader)->get_zip().c_str(), la, lo);
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "Geocode HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "Geocode request failed");'
                        # NWS points lookup -> gridpoint (once per zip change)
                        - if:
                            condition:
                              lambda: 'return id(lat) != 0.0f && id(lon) != 0.0f && id(sd_reader)->get_nws_wfo().empty();'
                            then:
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://api.weather.gov/points/%.4f,%.4f", id(lat), id(lon));'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              const char *gid = root["properties"]["gridId"].as<const char*>();
                                              int gx = root["properties"]["gridX"].as<int>();
                                              int gy = root["properties"]["gridY"].as<int>();
                                              if (gid && strlen(gid) > 0 && gx > 0 && gy > 0) {
                                                id(sd_reader)->save_nws_grid(std::string(gid), gx, gy);
                                                ESP_LOGI("main", "NWS grid: %s/%d,%d", gid, gx, gy);
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "NWS points HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "NWS points request failed");'
                        # NWS stations lookup -> nearest + fallback (once per zip change)
                        - if:
                            condition:
                              lambda: 'return !id(sd_reader)->get_nws_wfo().empty() && (id(sd_reader)->get_nws_station().empty() || id(sd_reader)->get_nws_station2().empty());'
                            then:
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://api.weather.gov/gridpoints/%s/%d,%d/stations?limit=2", id(sd_reader)->get_nws_wfo().c_str(), id(sd_reader)->get_nws_x(), id(sd_reader)->get_nws_y());'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              auto feats = root["features"].as<JsonArray>();
                                              if (feats.size() >= 1) {
                                                const char *sid = feats[0]["properties"]["stationIdentifier"].as<const char*>();
                                                if (sid && strlen(sid) > 0) {
                                                  id(sd_reader)->save_nws_station(std::string(sid));
                                                  ESP_LOGI("main", "NWS station: %s", sid);
                                                }
                                              }
                                              if (feats.size() >= 2) {
                                                const char *sid2 = feats[1]["properties"]["stationIdentifier"].as<const char*>();
                                                if (sid2 && strlen(sid2) > 0) {
                                                  id(sd_reader)->save_nws_station2(std::string(sid2));
                                                  ESP_LOGI("main", "NWS station2: %s", sid2);
                                                }
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "NWS stations HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "NWS stations request failed");'
                        # NWS 7-day forecast
                        - if:
                            condition:
                              lambda: 'return !id(sd_reader)->get_nws_wfo().empty();'
                            then:
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://api.weather.gov/gridpoints/%s/%d,%d/forecast", id(sd_reader)->get_nws_wfo().c_str(), id(sd_reader)->get_nws_x(), id(sd_reader)->get_nws_y());'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              JsonArray periods = root["properties"]["periods"].as<JsonArray>();
                                              if (periods.size() >= 2) {
                                                auto now = id(my_time).now();
                                                char today_str[11];
                                                snprintf(today_str, sizeof(today_str), "%04d-%02d-%02d", now.year, now.month, now.day_of_month);
                                                char prev_date[11] = "";
                                                int slot = -1;
                                                for (size_t i = 0; i < periods.size(); i++) {
                                                  const char *vt = periods[i]["startTime"].as<const char*>();
                                                  if (!vt || strncmp(vt, today_str, 10) < 0)
                                                    continue;  // skip before today
                                                  if (strncmp(vt, prev_date, 10) != 0) {
                                                    strncpy(prev_date, vt, 10);
                                                    prev_date[10] = 0;
                                                    slot++;
                                                    if (slot >= 7)
                                                      break;
                                                  }
                                                  int tf = periods[i]["temperature"].as<int>();
                                                  float tc = (tf - 32.0f) * 5.0f / 9.0f;
                                                  if (periods[i]["isDaytime"].as<bool>()) {
                                                    id(daily_max)[slot] = tc;
                                                    id(daily_code)[slot] = nws_code_from_text(periods[i]["shortForecast"].as<const char*>());
                                                    id(daily_precip)[slot] = periods[i]["probabilityOfPrecipitation"]["value"].as<int>();
                                                  } else {
                                                    id(daily_min)[slot] = tc;
                                                  }
                                                }
                                                for (int k = 1; k < 7; k++)
                                                  if (id(daily_min)[k] == 0.0f)
                                                    id(daily_min)[k] = id(daily_min)[k - 1];
                                                ESP_LOGI("main", "NWS forecast: today + %d days (today %s)", slot, today_str);
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "NWS forecast HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "NWS forecast request failed");'
                        # NWS current observation (nearest station)
                        - if:
                            condition:
                              lambda: 'return !id(sd_reader)->get_nws_station().empty();'
                            then:
                              - lambda: 'id(obs_got_valid) = false;'
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://api.weather.gov/stations/%s/observations/latest", id(sd_reader)->get_nws_station().c_str());'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              float t = root["properties"]["temperature"]["value"].as<float>();
                                              float h = root["properties"]["relativeHumidity"]["value"].as<float>();
                                              float ppa = root["properties"]["barometricPressure"]["value"].as<float>();
                                              float ws = root["properties"]["windSpeed"]["value"].as<float>();
                                              float wd = root["properties"]["windDirection"]["value"].as<float>();
                                              const char *td = root["properties"]["textDescription"].as<const char*>();
                                              if (t > -60.0f && t < 60.0f && h >= 0.0f && h <= 100.0f && ppa > 50000.0f && ppa < 120000.0f) {
                                                id(wifi_temp) = t;
                                                id(wifi_hum) = h;
                                                id(wifi_press) = ppa / 100.0f;
                                                id(wifi_wind) = ws;
                                                id(wifi_wind_dir) = wd;
                                                id(wifi_code) = nws_code_from_text(td);
                                                id(wifi_weather_valid) = true;
                                                id(obs_got_valid) = true;
                                                id(used_fallback) = false;
                                                id(last_wifi_millis) = millis();
                                                auto wt = id(my_time).now();
                                                id(last_wx_month) = wt.month;
                                                id(last_wx_day) = wt.day_of_month;
                                                id(last_wx_hour) = wt.hour;
                                                id(last_wx_minute) = wt.minute;
                                                ESP_LOGI("main", "NWS obs: %.1fC %.0f%% %.1fhPa '%s' code=%d", t, h, ppa / 100.0f, td ? td : "?", id(wifi_code));
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "NWS obs HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "NWS obs request failed");'
                        # NWS fallback observation (if primary station returned no data)
                        - if:
                            condition:
                              lambda: 'return !id(obs_got_valid) && !id(sd_reader)->get_nws_station2().empty();'
                            then:
                              - http_request.get:
                                  url: !lambda 'return str_sprintf("https://api.weather.gov/stations/%s/observations/latest", id(sd_reader)->get_nws_station2().c_str());'
                                  capture_response: true
                                  max_response_buffer_size: 16kB
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200) {
                                            json::parse_json(body, [&](JsonObject root) -> bool {
                                              float t = root["properties"]["temperature"]["value"].as<float>();
                                              float h = root["properties"]["relativeHumidity"]["value"].as<float>();
                                              float ppa = root["properties"]["barometricPressure"]["value"].as<float>();
                                              float ws = root["properties"]["windSpeed"]["value"].as<float>();
                                              float wd = root["properties"]["windDirection"]["value"].as<float>();
                                              const char *td = root["properties"]["textDescription"].as<const char*>();
                                              if (t > -60.0f && t < 60.0f && h >= 0.0f && h <= 100.0f && ppa > 50000.0f && ppa < 120000.0f) {
                                                id(wifi_temp) = t;
                                                id(wifi_hum) = h;
                                                id(wifi_press) = ppa / 100.0f;
                                                id(wifi_wind) = ws;
                                                id(wifi_wind_dir) = wd;
                                                id(wifi_code) = nws_code_from_text(td);
                                                id(wifi_weather_valid) = true;
                                                id(obs_got_valid) = true;
                                                id(used_fallback) = true;
                                                id(last_wifi_millis) = millis();
                                                auto wt = id(my_time).now();
                                                id(last_wx_month) = wt.month;
                                                id(last_wx_day) = wt.day_of_month;
                                                id(last_wx_hour) = wt.hour;
                                                id(last_wx_minute) = wt.minute;
                                                ESP_LOGI("main", "NWS obs (fb %s): %.1fC %.0f%% %.1fhPa '%s'", id(sd_reader)->get_nws_station2().c_str(), t, h, ppa / 100.0f, td ? td : "?");
                                              }
                                              return true;
                                            });
                                          } else {
                                            ESP_LOGW("main", "NWS obs2 HTTP %d", response->status_code);
                                          }
                                  on_error:
                                    then:
                                      - lambda: 'ESP_LOGW("main", "NWS obs2 request failed");'
                  - lambda: |-
                      int8_t rssi = id(wifi_comp)->wifi_rssi();
                      if (rssi < 0 && rssi > -100)
                        id(wifi_rssi) = rssi;
                  - lambda: |-
                      if (!isnan(id(ruuvi_temp).state))
                        id(sd_reader)->save_state(id(ruuvi_temp).state, id(ruuvi_hum).state,
                                                  id(ruuvi_press).state, id(ruuvi_batt).state,
                                                  (int) id(ruuvi_move).state);
                  - lambda: |-
                      float ph = isnan(id(ruuvi_press).state) ? id(sd_reader)->get_last_press()
                                                              : id(ruuvi_press).state;
                      if (ph > 500.0f && ph < 1200.0f)
                        id(sd_reader)->save_pressure_sample(ph);
                  - lambda: 'id(loading) = false; id(epd)->force_full_update();'
                  - component.update: epd
                  - delay: 3s
                else:
                  - component.update: epd
                  - delay: 3s
            - if:
                condition:
                  lambda: 'return !id(settings_mode);'
                then:
                  - lambda: 'ESP_LOGI("main", "sleeping");'
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      sleep_duration: 60s

